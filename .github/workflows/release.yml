name: Release Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        type: boolean

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    # Actions are pinned to commit SHAs (tags can be moved); the comment is the version.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the token in .git/config, where dependency install scripts could read it.
          # The release step below gets its own token.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm run build:win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
