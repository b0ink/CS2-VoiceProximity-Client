name: Build Windows

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    # Actions are pinned to commit SHAs (tags can be moved); the comment is the version.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the token in .git/config, where dependency install scripts could read it.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm run build:win

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: dist/*.exe
